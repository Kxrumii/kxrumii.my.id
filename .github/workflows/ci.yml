name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@12.2.3

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript workspaces
        run: npm run check

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Build all applications and Astro site
        run: npm run build

      - name: Verify generated pages
        run: |
          test -f dist/index.html
          test -f dist/profil/index.html
          test -f dist/tugas/index.html
          test -f dist/tugas/pertemuan-1/index.html
          test -f dist/tugas/pertemuan-6/index.html
          test -f dist/tugas/pertemuan-7/index.html
          test -f dist/tugas/pertemuan-8/index.html

      - name: Verify shared transition bootstrap
        run: node scripts/verify-transition-bootstrap.mjs