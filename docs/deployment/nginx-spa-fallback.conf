# Snippet untuk server block website /var/www/web2.
# Letakkan sebelum location / yang sudah ada.
# Terapkan hanya setelah dist hasil monorepo di-deploy dan diverifikasi.

location = /tugas/pertemuan-8 {
    return 301 /tugas/pertemuan-8/;
}

location ^~ /tugas/pertemuan-8/ {
    try_files $uri $uri/ /tugas/pertemuan-8/index.html;
}
